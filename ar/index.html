<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Dynamic 3D AR Menu</title>

    <!-- Import Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Link to external styles -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Import the model-viewer component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>
</head>

<body>

    <!-- Full Screen AR Viewer -->
    <model-viewer id="ar-viewer" alt="A 3D model" camera-controls touch-action="pan-y" ar
        ar-modes="webxr scene-viewer quick-look" shadow-intensity="1.5" shadow-softness="1" ar-scale="fixed"
        disable-zoom>

        <button slot="ar-button" class="ar-button">
            View in AR
        </button>
    </model-viewer>

    <!-- UI Panel (Premium Restaurant Vibe) -->
    <div class="ui-panel">
        <div class="panel-header">
            <h3>Gourmet AR Menu</h3>
            <p>Select a dish to view in your space</p>
        </div>

        <div class="categories" id="category-filters">
            <button class="category-btn active" data-category="All">All</button>
            <button class="category-btn" data-category="Pizza">Pizza</button>
            <button class="category-btn" data-category="Pasta">Pasta</button>
            <button class="category-btn" data-category="Pastries">Pastries</button>
        </div>

        <div class="menu-container" id="menu-items">
            <!-- Items will be dynamically injected here -->
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loader" class="loader-container">
        <div class="spinner"></div>
    </div>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>

</html>
